[package]
name = "spike-settings-thread"
version = "0.0.0"
edition = "2024"
publish = false

# standalone: not a member of rust/'s workspace
[workspace]

[dependencies]
spike-common = { path = "../common" }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash", "fontconfig"] }
# Settings: iced on its CPU renderer only (no wgpu feature, so no GPU library can be loaded)
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "x11", "tokio"] }
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
