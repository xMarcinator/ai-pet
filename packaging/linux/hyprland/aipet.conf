# AiPet's window rules for Hyprland 0.53 and 0.54 (hyprland.conf). The installers put this file in
# ~/.local/share/AiPet/hyprland/; include it from ~/.config/hypr/hyprland.conf with:
#
#   source = ~/.local/share/AiPet/hyprland/aipet.conf
#
# For the Lua config (Hyprland 0.55 and later) use aipet.lua next to this file.
#
# The pet and its Settings draw their own frames and shadows on transparent windows, so Hyprland's border, rounding,
# blur and shadow would frame the whole transparent rectangle. The pet moves itself while it's dragged, and an
# animated move makes the drag overshoot. Pinned, it stays on its monitor whichever workspace is shown.
# Don't add no_focus: the pet then gets no mouse input at all.

windowrule {
  name = aipet-pet
  match:class = ^AiPet$
  match:title = ^AiPet$

  float = on
  pin = on
  border_size = 0
  rounding = 0
  no_blur = on
  no_shadow = on
  no_anim = on
}

windowrule {
  name = aipet-settings
  match:class = ^AiPet$
  match:title = ^AiPet · Settings$

  border_size = 0
  rounding = 0
  no_blur = on
  no_shadow = on
}

# Hyprland 0.52 and earlier had windowrulev2 instead; the same rules there:
#   windowrulev2 = float, class:^(AiPet)$, title:^(AiPet)$
#   windowrulev2 = pin, class:^(AiPet)$, title:^(AiPet)$
#   windowrulev2 = bordersize 0, class:^(AiPet)$
#   windowrulev2 = rounding 0, class:^(AiPet)$
#   windowrulev2 = noblur, class:^(AiPet)$
#   windowrulev2 = noshadow, class:^(AiPet)$
#   windowrulev2 = noanim, class:^(AiPet)$, title:^(AiPet)$
