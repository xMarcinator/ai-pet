# AiPet's rules for Hyprland 0.53 and 0.54 (hyprland.conf). The installers put this file in
# ~/.local/share/AiPet/hyprland/; include it from ~/.config/hypr/hyprland.conf with:
#
#   source = ~/.local/share/AiPet/hyprland/aipet.conf
#
# For the Lua config (Hyprland 0.55 and later) use aipet.lua next to this file.
#
# The pet is a layer surface in the "aipet" namespace. It moves itself while it's dragged, and Hyprland's layers
# animation would make each move glide behind the pointer, so the rule turns that off. Layers aren't blurred unless a
# rule asks for it, so the pet needs nothing else.
#
# Settings draws its own frame and shadow on a transparent window, so Hyprland's border, rounding, blur and shadow
# would frame the whole transparent rectangle. It's matched by its title, which the pet sets on every backend.

layerrule {
  name = aipet-pet
  match:namespace = ^aipet$

  no_anim = on
}

windowrule {
  name = aipet-settings
  match:title = ^AiPet · Settings$

  border_size = 0
  rounding = 0
  no_blur = on
  no_shadow = on
}

# Hyprland 0.52 and earlier had layerrule and windowrulev2 lines instead; the same rules there:
#   layerrule = noanim, ^(aipet)$
#   windowrulev2 = bordersize 0, title:^(AiPet · Settings)$
#   windowrulev2 = rounding 0, title:^(AiPet · Settings)$
#   windowrulev2 = noblur, title:^(AiPet · Settings)$
#   windowrulev2 = noshadow, title:^(AiPet · Settings)$
