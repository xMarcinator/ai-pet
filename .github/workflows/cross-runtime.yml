# Mixed runtimes, until .NET is gone, on Windows and Linux:
# - the Rust hook (rust/crates/aipet-hook) against the .NET pet. The C#'s own black-box hook suites run unchanged,
#   with AIPET_TEST_HOOK pointing their hook runs (TestEnv.HookStartInfo) at the Rust hook instead of
#   `dotnet hook/aipet-hook.dll`; the pet is the C#'s HookServer, as in CI.
# - the .NET hook against the Rust pet: the Rust hook server's tests (rust/crates/aipet-core/tests/server.rs), with
#   AIPET_TEST_HOOK naming the .NET hook's dll, which they run with `dotnet` instead of the Rust hook.
# - the .NET pet against the Rust pet, on Linux: the single-instance lock both take (one pet per user), each pet
#   started for real on a virtual X display, in either order, at the same moment, and with different or unset
#   XDG_RUNTIME_DIR values or an AIPET_PIPE.
# Nothing is published here.
name: Cross-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  rust-hook:
    name: Rust hook, .NET pet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            hook: aipet-hook.exe
          - os: ubuntu-22.04
            hook: aipet-hook
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a fresh unsigned exe gets scanned on every start, which the tests' time budgets would feel; best effort
      - name: Leave rust/target to Defender's exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE 'rust\target') -ErrorAction Stop }
          catch { Write-Output "No Defender exclusion: $($_.Exception.Message)" }
      # the workspace's rust-version, as in ci.yml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the Rust hook
        working-directory: rust
        run: cargo build -p aipet-hook --release --locked
      # the tests and the pet (AiPet.Core) they run; the .NET hook is built too, for the modes that still run it
      - name: Build the tests
        run: dotnet build tests/AiPet.Tests -c Release --nologo
      # The classes that run the hook: on its event path, for its plugin hook files (PluginHooksTests), and for
      # --install and --doctor (RegistrationTests). Those of the other system report as skipped. A filter that selects
      # nothing, or a run where nothing passed, fails: a green run must have run the Rust hook.
      - name: The C#'s hook suites against the Rust hook
        shell: bash
        env:
          AIPET_TEST_HOOK: ${{ github.workspace }}/rust/target/release/${{ matrix.hook }}
        run: |
          classes=(HookContractTests HookSocketTests HookRequestSizeTests EndToEndTests HookServerTests NoPetTests
                   HookServerUnixTests StarvedPoolTests PluginHooksTests RegistrationTests PackageInstallerTests)
          filter=$(printf 'FullyQualifiedName~AiPet.Tests.%s.|' "${classes[@]}")
          set -o pipefail
          dotnet test tests/AiPet.Tests -c Release --nologo --no-build --filter "${filter%|}" 2>&1 | tee test.log
          passed=$(sed -nE 's/.*Passed: *([0-9]+),.*/\1/p' test.log | tail -n 1)
          echo "passed: ${passed:-none}"
          [ "${passed:-0}" -gt 0 ]
      # The trace log's checks as root, where a file another user owns can still be opened, so the owner check is
      # what refuses it (a_file_another_user_owns_is_left_alone skips for anyone else). The rest run as root too.
      - name: The trace log's tests as root
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          set -o pipefail
          exe=$(cargo test -p aipet-hook --release --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.kind == ["bin"] and .profile.test) | .executable')
          [ -n "$exe" ] || { echo "no test executable for the hook"; exit 1; }
          sudo "$exe" trace:: --test-threads=1 --nocapture 2>&1 | tee trace.log
          grep -q 'a_file_another_user_owns_is_left_alone ... ok' trace.log
          ! grep -q 'skipped: only root' trace.log
      # --doctor with the organisation's managed Claude settings, which only a runner may write: the golden generator
      # runs those scenarios through the C# hook, and tests/doctor.rs through the Rust one, each writing the file and
      # taking it away again (AIPET_TEST_MANAGED_SETTINGS). Linux keeps them in a folder of root's, which the runner's
      # user gets for this. None of the managed scenarios may have been left out.
      - name: The doctor with managed settings, against the C#
        shell: bash
        env:
          AIPET_GOLDEN: ${{ github.workspace }}/rust/golden/bin/Release/net10.0/aipet-golden.dll
          AIPET_TEST_MANAGED_SETTINGS: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo install -d -o "$(id -u)" -g "$(id -g)" /etc/claude-code; fi
          dotnet build rust/golden -c Release --nologo -p:UseAppHost=false
          cd rust
          set -o pipefail
          cargo test -p aipet-hook --release --locked --test doctor the_csharp_on_this_os_is_replayed -- --nocapture \
            2>&1 | tee doctor.log
          grep -q '^test the_csharp_on_this_os_is_replayed ... ok' doctor.log
          ! grep -E 'claude-managed-[a-z-]+: (left out|skipped)' doctor.log

  csharp-hook:
    name: .NET hook, Rust pet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the tests' own exe is a fresh unsigned one too; best effort
      - name: Leave rust/target to Defender's exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE 'rust\target') -ErrorAction Stop }
          catch { Write-Output "No Defender exclusion: $($_.Exception.Message)" }
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # run as `dotnet aipet-hook.dll`, as the C#'s own tests run it
      - name: Build the .NET hook
        run: dotnet build src/AiPet.Hook -c Release --nologo -p:UseAppHost=false
      # The server's tests run the hook that AIPET_TEST_HOOK names instead of the Rust one. Each test that runs a hook
      # must have passed: a green run must have run the .NET hook.
      - name: The Rust pet's server tests against the .NET hook
        shell: bash
        working-directory: rust
        env:
          AIPET_TEST_HOOK: ${{ github.workspace }}/src/AiPet.Hook/bin/Release/net10.0/aipet-hook.dll
        run: |
          set -o pipefail
          cargo test -p aipet-core --test server --locked 2>&1 | tee server.log
          hooked=(codex_scrambled_hooks_end_at_the_latest_turn claude_hook_forwards_the_event_and_its_environment_silently
                  a_hook_with_garbage_on_stdin_exits_0_silently silent_clients_are_cut_off_while_the_pet_keeps_serving
                  listeners_answer_hooks_while_every_cpu_is_busy)
          if [ "$RUNNER_OS" = Linux ]; then
            hooked+=(unix::a_flood_of_silent_connections_is_capped_and_the_pet_still_answers)
          fi
          for test in "${hooked[@]}"; do
            grep -q "^test $test ... ok" server.log || { echo "$test didn't pass against the .NET hook"; exit 1; }
          done
      # Root gets past the socket's mode, so as a second user it meets the peer check itself; sudo needs no password
      # here. The test skips where it can't be root, so it must not have skipped.
      - name: The peer check against a second user
        if: runner.os == 'Linux'
        shell: bash
        working-directory: rust
        run: |
          set -o pipefail
          cargo test -p aipet-core --test server --locked -- --exact unix::a_peer_running_as_another_user_is_refused \
            --nocapture 2>&1 | tee peer.log
          grep -q '^test unix::a_peer_running_as_another_user_is_refused ... ok' peer.log
          ! grep -q 'skipped:' peer.log

  # One pet per user, whichever runtime each is: the .NET pet (src/AiPet.UI/Program.cs) and the Rust pet
  # (rust/crates/aipet/src/single.rs) both flock the lock file next to the hooks' socket, <AIPET_PIPE>.lock under that
  # override. Each implementation was tested against a lock taken the contract's way; here the two real pets meet.
  # Every case must end with exactly one pet running: the one started first, or either when they start together, and
  # the other one gone, quietly (exit 0).
  lock:
    name: .NET pet and Rust pet, one at a time (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a virtual X display, Mesa's software GL for the Rust pet, and libxkbcommon to build it
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1-mesa-dri libegl-mesa0 pkg-config libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the Rust pet
        working-directory: rust
        run: cargo build -p aipet --release --locked
      - name: Build the .NET pet
        run: dotnet build src/AiPet.UI -c Release --nologo -o out/dotnet
      - name: Start them against each other
        run: |
          dotnet_pet=$PWD/out/dotnet/AiPet
          rust_pet=$PWD/rust/target/release/AiPet
          uid=$(id -u)
          # The socket's rule puts it in /run/user/<uid> first, whatever XDG_RUNTIME_DIR says: that's what keeps pets
          # with different values on one lock. A login session has the folder; make sure this runner has it too.
          if [ ! -d "/run/user/$uid" ]; then sudo install -d -m 700 -o "$uid" -g "$(id -g)" "/run/user/$uid"; fi
          logs=$RUNNER_TEMP/pet-logs
          mkdir -p "$logs" "$RUNNER_TEMP/xdg-a" "$RUNNER_TEMP/xdg-b"
          chmod 700 "$RUNNER_TEMP/xdg-a" "$RUNNER_TEMP/xdg-b"
          Xvfb :99 -screen 0 1920x1080x24 > "$logs/xvfb.log" 2>&1 &
          export DISPLAY=:99
          # the pets' own data (settings, logs) in a folder of the runner's temp folder, and no Wayland
          export AIPET_DATA_DIR=$RUNNER_TEMP/aipet-data
          unset WAYLAND_DISPLAY
          sleep 2

          # (no command substitutions around the pets: wait works only on this shell's own children)
          failed=0 n=0 what= pid= status=
          fail() { echo "::error::$what: $*"; failed=1; }
          # running, not ended: a pet that has exited stays a zombie until it's waited for, which kill -0 still finds
          alive() { local state; state=$(sed 's/.*) //' "/proc/$1/stat" 2>/dev/null | cut -c1); [ -n "$state" ] && [ "$state" != Z ]; }
          # start <dotnet|rust> [env options and settings...]: sets pid
          start() {
            local pet=$1 bin=$rust_pet
            shift
            if [ "$pet" = dotnet ]; then bin=$dotnet_pet; fi
            env "$@" "$bin" > "$logs/$n-$pet.log" 2>&1 &
            pid=$!
          }
          # settle <pid> <seconds>: sets status to the pet's exit status, or to running if it still runs by then
          settle() {
            local i=0
            status=running
            while :; do
              if ! alive "$1"; then status=0; wait "$1" || status=$?; return; fi
              ((i++ < $2 * 10)) || return 0
              sleep 0.1
            done
          }
          # stop <pid>...: ends whichever still run, and waits for them
          stop() {
            local p i
            for p in "$@"; do kill "$p" 2>/dev/null || true; done
            for ((i = 0; i < 50; i++)); do
              alive "$1" || alive "${2:-$1}" || break
              sleep 0.1
            done
            for p in "$@"; do kill -9 "$p" 2>/dev/null || true; wait "$p" 2>/dev/null || true; done
          }
          show_logs() { for f in "$logs/$n"-*.log; do echo "--- $(basename "$f")"; cat "$f"; done; }
          # split <args>: the settings before -- go to a, the ones after it to b
          split() {
            a=() b=()
            while [ $# -gt 0 ] && [ "$1" != -- ]; do a+=("$1"); shift; done
            if [ $# -gt 0 ]; then shift; fi
            b=("$@")
          }

          # one_after_the_other <first> <second> <first's env> -- <second's env>: the first runs, the second quits
          one_after_the_other() {
            local first=$1 second=$2 p1 p2
            shift 2
            split "$@"
            n=$((n + 1)) what="case $n: $first, then $second (${a[*]:-as the runner has it} / ${b[*]:-as the runner has it})"
            local before=$failed
            failed=0
            start "$first" "${a[@]}"; p1=$pid
            sleep 8
            if ! alive "$p1"; then
              fail "the $first pet didn't keep running on its own"
            else
              start "$second" "${b[@]}"; p2=$pid
              settle "$p2" 20
              if [ "$status" = running ]; then fail "the $second pet runs next to the $first pet"
              elif [ "$status" != 0 ]; then fail "the $second pet exited with $status, not quietly"
              elif ! alive "$p1"; then fail "the $first pet stopped"
              else echo "ok - $what"; fi
            fi
            if [ "$failed" = 1 ]; then show_logs; fi
            stop "$p1" ${p2:+"$p2"}
            if [ "$before" = 1 ]; then failed=1; fi
          }

          # together <dotnet's env> -- <rust's env>: started at the same moment, exactly one runs
          together() {
            local p1 p2 s1 s2
            split "$@"
            n=$((n + 1)) what="case $n: both at once (${a[*]:-as the runner has it} / ${b[*]:-as the runner has it})"
            local before=$failed
            failed=0
            start dotnet "${a[@]}"; p1=$pid
            start rust "${b[@]}"; p2=$pid
            sleep 12
            settle "$p1" 0; s1=$status
            settle "$p2" 0; s2=$status
            if [ "$s1" = running ] && [ "$s2" = running ]; then fail "both pets run"
            elif [ "$s1" != running ] && [ "$s2" != running ]; then fail "neither pet runs (exits $s1 and $s2)"
            elif [ "$s1" != running ] && [ "$s1" != 0 ]; then fail "the .NET pet exited with $s1, not quietly"
            elif [ "$s2" != running ] && [ "$s2" != 0 ]; then fail "the Rust pet exited with $s2, not quietly"
            elif [ "$s1" = running ]; then echo "ok - $what: the .NET pet runs"
            else echo "ok - $what: the Rust pet runs"; fi
            if [ "$failed" = 1 ]; then show_logs; fi
            stop "$p1" "$p2"
            if [ "$before" = 1 ]; then failed=1; fi
          }

          unset_xdg=(-u XDG_RUNTIME_DIR)
          xdg_a=(XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-a")
          xdg_b=(XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-b")
          pipe=(AIPET_PIPE="$RUNNER_TEMP/pets.sock")
          # the runner's own environment, unset, different values, and one unset against one set
          for envs in "unset_xdg unset_xdg" "xdg_a xdg_b" "unset_xdg xdg_b" "xdg_a unset_xdg"; do
            read -r x y <<< "$envs"
            declare -n ea=$x eb=$y
            one_after_the_other dotnet rust "${ea[@]}" -- "${eb[@]}"
            one_after_the_other rust dotnet "${ea[@]}" -- "${eb[@]}"
            for _ in 1 2 3; do together "${ea[@]}" -- "${eb[@]}"; done
            unset -n ea eb
          done
          one_after_the_other dotnet rust --
          one_after_the_other rust dotnet --
          together --
          # AIPET_PIPE ending in .sock: the lock is <AIPET_PIPE>.lock on both sides, whatever XDG_RUNTIME_DIR says
          one_after_the_other dotnet rust "${pipe[@]}" "${xdg_a[@]}" -- "${unset_xdg[@]}" "${pipe[@]}"
          one_after_the_other rust dotnet "${unset_xdg[@]}" "${pipe[@]}" -- "${pipe[@]}" "${xdg_b[@]}"
          for _ in 1 2 3; do together "${pipe[@]}" "${xdg_a[@]}" -- "${pipe[@]}" "${xdg_b[@]}"; done
          if [ ! -f "$RUNNER_TEMP/pets.sock.lock" ]; then what=AIPET_PIPE; fail "no lock at <AIPET_PIPE>.lock"; fi
          echo "$n cases" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lock-logs
          path: ${{ runner.temp }}/pet-logs
          if-no-files-found: warn
          retention-days: 7
