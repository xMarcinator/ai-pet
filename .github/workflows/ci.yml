# CI: builds the solution and runs its tests on Windows and Linux, checks that the plugin's hook files are what the
# hook that ships (the Rust one) makes of its event tables, and that the install and build scripts at least parse and
# stay executable. The Rust workspace (rust/) gets its format, lints and tests on Windows and Linux, and a compile check
# on macOS. The Rust hook's start-up is timed against the NativeAOT hook's it replaces. Nothing is published here: see
# release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # the workspace's rust-version, as in the rust job: the hook that ships is the Rust one
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Build
        run: dotnet build AiPet.slnx -c Release --nologo
      - name: Build the Rust hook
        working-directory: rust
        run: cargo build -p aipet-hook --release --locked
      # The tests run the .NET hook just built (dotnet aipet-hook.dll) against a HookServer on a temp pipe or socket,
      # with temp data and temp folders, so nothing of the runner's user is touched. Windows is where the pet's cut-off
      # of a silent client (CancelIoEx) is tried out. (cross-runtime.yml runs them against the Rust hook.)
      - name: Test
        run: dotnet test AiPet.slnx -c Release --nologo --no-build
      # The Rust hook carries the .NET hook's Windows resources byte for byte: the icon, the manifest and the version
      # resource that names aipet-hook.exe, from its build script. The test must have run, not been skipped.
      - name: The Rust hook's resources, against the .NET hook's
        if: runner.os == 'Windows'
        shell: bash
        env:
          AIPET_TEST_HOOK: ${{ github.workspace }}/rust/target/release/aipet-hook.exe
        run: |
          set -o pipefail
          dotnet test AiPet.slnx -c Release --nologo --no-build --filter "FullyQualifiedName~AiPet.Tests.ResourceTests.RustHook" \
            2>&1 | tee resources.log
          passed=$(sed -nE 's/.*Passed: *([0-9]+),.*/\1/p' resources.log | tail -n 1)
          [ "${passed:-0}" -eq 1 ]
      # Manifests, hook files and marketplaces: valid JSON, the name aipet and one version, and the hook files exactly
      # what the Rust hook just built prints for them (aipet-hook --print-plugin-hooks), so the plugin can't drift from
      # the code. On both OSes, since each builds its own hook; the release checks its Linux one again.
      - name: Check the plugin and marketplace files
        shell: bash
        run: bash scripts/check-plugin.sh --marketplaces . plugins/aipet --hook rust/target/release/aipet-hook

      # The PowerShell scripts can't be tried out here, but they must at least parse, in Windows PowerShell 5.1 too:
      # that's what `irm ... | iex` usually runs in.
      - name: Parse the PowerShell scripts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          $files = @('install.ps1', 'build.ps1') + @(Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$problems)
            foreach ($p in $problems) { Write-Output "::error file=$file,line=$($p.Extent.StartLineNumber)::$($p.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Output "Parsed: $($files -join ', ')"
      - name: Parse the PowerShell scripts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          $files = @('install.ps1', 'build.ps1') + @(Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$problems)
            foreach ($p in $problems) { Write-Output "::error file=$file,line=$($p.Extent.StartLineNumber)::$($p.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Output "Parsed: $($files -join ', ')"

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a fresh unsigned exe gets scanned on every start, which the tests' time budgets would feel; best effort, as in
      # cross-runtime.yml
      - name: Leave rust/target to Defender's exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE 'rust\target') -ErrorAction Stop }
          catch { Write-Output "No Defender exclusion: $($_.Exception.Message)" }
      # aipet-wayland links libxkbcommon
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev
      # the workspace's rust-version, so a new stable's lints can't break the build
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      # the cargo registry and rust/target, keyed by the toolchain installed above
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # aipet-ipc's tests hold the endpoint and data paths against the C#'s in the same environments: the golden
      # generator's ipc mode (rust/crates/aipet-ipc/src/csharp.rs)
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build the golden generator
        run: dotnet build golden -c Release --nologo
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # every test binary runs even when one fails, so a run shows every failure at once
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
        env:
          AIPET_GOLDEN: ${{ github.workspace }}/rust/golden/bin/Release/net10.0/aipet-golden.dll
          # aipet-core's Credential Manager test writes a throwaway entry, which only a CI runner should get
          AIPET_TEST_CREDENTIAL_MANAGER: "1"
      # As uid 0 in a user namespace there is no /run/user/<uid>, so the socket's path comes from XDG_RUNTIME_DIR or
      # the data folder: the rules the runner's own uid never gets to.
      - name: Test the endpoint without a /run/user folder
        if: runner.os == 'Linux'
        run: unshare -r cargo test -p aipet-ipc --locked csharp
        env:
          AIPET_GOLDEN: ${{ github.workspace }}/rust/golden/bin/Release/net10.0/aipet-golden.dll

  # macOS isn't a release target, but its code keeps compiling
  rust-macos:
    name: Rust (macos-14, check)
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Check
        run: cargo check --workspace --all-targets --locked

  # The hook runs on every agent event, so it must start fast: the Rust hook's median start-to-exit time on the event
  # path, with no pet, may be at most 10 % over that of the NativeAOT hook it replaces, on the same runner. bash runs
  # each 200 times, as an agent's shell would, the two in turns so that a busy moment on the runner slows both.
  hook-startup:
    name: Hook start-up (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64 }
          - { os: ubuntu-22.04, rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a fresh unsigned exe gets scanned when it starts, which would be timed too; best effort, as in the rust job
      - name: Leave the hooks to Defender's exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($dir in 'rust\target', 'out') {
            try { Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE $dir) -ErrorAction Stop }
            catch { Write-Output "No Defender exclusion for ${dir}: $($_.Exception.Message)" }
          }
      # NativeAOT links with clang on Linux
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # as the release builds it: on Windows with the C runtime linked in
      - name: Build the Rust hook
        working-directory: rust
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo build -p aipet-hook --release --locked --target-dir target/startup
      - name: Publish the NativeAOT hook
        run: |
          # NativeAOT finds the MSVC linker through vswhere
          if [ "$RUNNER_OS" = Windows ]; then export PATH="$PATH:/c/Program Files (x86)/Microsoft Visual Studio/Installer"; fi
          dotnet publish src/AiPet.Hook/AiPet.Hook.csproj -c Release -r "$RID" -o out/aot -p:PublishAot=true -p:DebugType=none --nologo
          # a managed (non-AOT) publish would leave aipet-hook.dll next to the exe
          if [ -f out/aot/aipet-hook.dll ]; then echo "::error::The hook wasn't compiled natively"; ls -la out/aot; exit 1; fi
      - name: Time both hooks
        run: |
          exe=; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          rust="rust/target/startup/release/aipet-hook$exe" aot="out/aot/aipet-hook$exe" runs=200
          # no pet: an endpoint nothing listens on (a pipe name on Windows, a socket path on Linux), and folders of the
          # runner's temp folder
          if [ "$RUNNER_OS" = Windows ]; then export AIPET_PIPE="AiPet-startup-$GITHUB_RUN_ID-$RANDOM"
          else export AIPET_PIPE="$RUNNER_TEMP/aipet-startup.sock"; fi
          export AIPET_DATA_DIR="$RUNNER_TEMP/aipet-data" TMPDIR="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP"
          printf '%s' '{"hook_event_name":"PreToolUse","session_id":"startup","tool_name":"Bash","tool_input":{"command":"ls"}}' > event.json
          for i in 1 2 3 4 5; do "$rust" < event.json; "$aot" < event.json; done  # the file cache, and the first scans
          : > rust.times; : > aot.times
          for i in $(seq "$runs"); do
            if [ $((i % 2)) = 0 ]; then order="rust aot"; else order="aot rust"; fi
            for hook in $order; do
              # EPOCHREALTIME: microseconds, and no process started to read them
              t0=$EPOCHREALTIME
              "${!hook}" --agent claude < event.json
              t1=$EPOCHREALTIME
              echo "${t0//[!0-9]/} ${t1//[!0-9]/}" >> "$hook.times"
            done
          done
          median() { awk '{ print $2 - $1 }' "$1" | sort -n | awk '{ v[NR] = $1 } END { print (NR % 2) ? v[(NR + 1) / 2] : (v[NR / 2] + v[NR / 2 + 1]) / 2 }'; }
          r=$(median rust.times) a=$(median aot.times)
          ms() { awk -v us="$1" 'BEGIN { printf "%.2f ms", us / 1000 }'; }
          {
            echo "Hook start-up on $RUNNER_OS, the median of $runs runs each, with no pet:"
            echo "- Rust: $(ms "$r")"
            echo "- NativeAOT: $(ms "$a")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if ! awk -v r="$r" -v a="$a" 'BEGIN { exit !(r <= a * 1.1) }'; then
            echo "::error::The Rust hook takes $(ms "$r") to start and exit, over 10 % more than the NativeAOT hook's $(ms "$a")"
            exit 1
          fi

  scripts:
    name: Shell scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse
        run: |
          # POSIX sh: the one-liner (piped into sh, which is dash on Debian and Ubuntu), the package's installer and
          # the plugin's launcher
          for f in install.sh packaging/linux/install.sh plugins/aipet/native/aipet-hook.sh; do dash -n "$f"; done
          for f in build.sh scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh build.sh packaging/linux/install.sh plugins/aipet/native/aipet-hook.sh scripts/*.sh
      - name: Executable bits
        run: |
          # The docs run these as ./build.sh and so on, so git must record them as executable (100755). A script added
          # on Windows gets 100644 unless it's set with git update-index --chmod=+x. The plugin's launcher is run
          # through sh, so it needn't be.
          # --error-unmatch fails the step if one of them is gone, instead of no longer checking it.
          listed=$(git ls-files -s --error-unmatch -- build.sh install.sh packaging/linux/install.sh 'scripts/*.sh')
          bad=0
          while read -r mode _ _ path; do
            if [ "$mode" != 100755 ]; then
              echo "::error file=$path::$path isn't executable in git (mode $mode): git update-index --chmod=+x $path"
              bad=1
            fi
          done <<< "$listed"
          exit "$bad"
