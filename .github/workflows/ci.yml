# CI: the Rust workspace (rust/) gets its format, lints and tests on Windows and Linux, and a compile check on macOS.
# It also checks that the plugin's hook files are what the hook makes of its event tables, that the install and build
# scripts at least parse and stay executable, that the agent skills' Codex copies match, that the parity ledger
# (rust/PARITY.md) still maps every C# test to Rust tests that are there, and that nothing names what the cutover to
# Rust removed, that THIRD-PARTY-NOTICES.md is what cargo-about generates, and that the workspace-hack crate is what
# cargo-hakari generates. No .NET is installed here. Nothing is published here: see release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the workspace's rust-version, as in the rust job
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Build the Rust hook
        working-directory: rust
        run: cargo build -p aipet-hook --release --locked
      # Manifests, hook files and marketplaces: valid JSON, the name aipet and one version, and the hook files exactly
      # what the Rust hook just built prints for them (aipet-hook --print-plugin-hooks), so the plugin can't drift from
      # the code. On both OSes, since each builds its own hook; the release checks its Linux one again.
      - name: Check the plugin and marketplace files
        shell: bash
        run: bash scripts/check-plugin.sh --marketplaces . plugins/aipet --hook rust/target/release/aipet-hook

      # The PowerShell scripts can't be tried out here, but they must at least parse, in Windows PowerShell 5.1 too:
      # that's what `irm ... | iex` usually runs in.
      - name: Parse the PowerShell scripts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          $files = @('install.ps1', 'build.ps1') + @(Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$problems)
            foreach ($p in $problems) { Write-Output "::error file=$file,line=$($p.Extent.StartLineNumber)::$($p.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Output "Parsed: $($files -join ', ')"
      - name: Parse the PowerShell scripts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          $files = @('install.ps1', 'build.ps1') + @(Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null; $problems = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$problems)
            foreach ($p in $problems) { Write-Output "::error file=$file,line=$($p.Extent.StartLineNumber)::$($p.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Output "Parsed: $($files -join ', ')"

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a fresh unsigned exe gets scanned on every start, which the tests' time budgets would feel; best effort
      - name: Leave rust/target to Defender's exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath (Join-Path $env:GITHUB_WORKSPACE 'rust\target') -ErrorAction Stop }
          catch { Write-Output "No Defender exclusion: $($_.Exception.Message)" }
      # aipet-wayland links libxkbcommon
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev
      # the workspace's rust-version, so a new stable's lints can't break the build
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      # the cargo registry and rust/target, keyed by the toolchain installed above
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # the black-box suites run the workspace's binaries (aipet-testkit's `built`), which cargo test builds only
      # for their own package's tests
      - name: Build the binaries
        run: cargo build --workspace --locked
      # every test binary runs even when one fails, so a run shows every failure at once
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
        env:
          # aipet-core's Credential Manager test writes a throwaway entry, which only a CI runner should get
          AIPET_TEST_CREDENTIAL_MANAGER: "1"
      # The trace log's checks as root, where a file another user owns can still be opened, so the owner check is
      # what refuses it (a_file_another_user_owns_is_left_alone skips for anyone else). The rest run as root too.
      - name: The trace log's tests as root
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          exe=$(cargo test -p aipet-hook --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.kind == ["bin"] and .profile.test) | .executable')
          [ -n "$exe" ] || { echo "no test executable for the hook"; exit 1; }
          sudo "$exe" trace:: --test-threads=1 --nocapture 2>&1 | tee trace.log
          grep -q 'a_file_another_user_owns_is_left_alone ... ok' trace.log
          ! grep -q 'skipped: only root' trace.log
      # Root gets past the socket's mode, so as a second user it meets the peer check itself; sudo needs no password
      # here. The test skips where it can't be root, so it must not have skipped.
      - name: The peer check against a second user
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo test -p aipet-core --test server --locked -- --exact unix::a_peer_running_as_another_user_is_refused \
            --nocapture 2>&1 | tee peer.log
          grep -q '^test unix::a_peer_running_as_another_user_is_refused ... ok' peer.log
          ! grep -q 'skipped:' peer.log

  # macOS isn't a release target, but its code keeps compiling
  rust-macos:
    name: Rust (macos-14, check)
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Check
        run: cargo check --workspace --all-targets --locked

  # THIRD-PARTY-NOTICES.md must be exactly what cargo-about makes of rust/about.toml and rust/about.hbs, and give a
  # license text for every crate the release builds compile in (spec fn-1, R19).
  notices:
    name: Third-party notices
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
      # the cargo registry and ~/.cargo/bin, so cargo-about is built once per cache
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # the version check-notices.sh asks for; the binary needs the cli feature
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      # every target's crates, since the check runs offline (--frozen)
      - name: Fetch the crates
        working-directory: rust
        run: cargo fetch --locked
      - name: Check the notices
        run: bash scripts/check-notices.sh
      # The workspace-hack crate (rust/crates/workspace-hack) must be what cargo-hakari makes of
      # rust/.config/hakari.toml, with every member that should depend on it doing so. Here because this job has the
      # crates and ~/.cargo/bin cached; it reads metadata only and builds nothing.
      - name: Install cargo-hakari
        run: cargo install cargo-hakari --version 0.9.39 --locked
      - name: Check the workspace-hack crate
        working-directory: rust
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run && cargo hakari verify

  scripts:
    name: Shell scripts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse
        run: |
          # POSIX sh: the one-liner (piped into sh, which is dash on Debian and Ubuntu), the package's installer and
          # the plugin's launcher
          for f in install.sh packaging/linux/install.sh plugins/aipet/native/aipet-hook.sh; do dash -n "$f"; done
          for f in build.sh scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh build.sh packaging/linux/install.sh plugins/aipet/native/aipet-hook.sh scripts/*.sh
      # The agent skills Codex reads (.agents/skills/) must be the ones Claude Code reads (.claude/skills/), file for file.
      - name: The skills' Codex copies
        run: bash scripts/check-skill-copies.sh
      # rust/PARITY.md maps every C# test (removed at the cutover) to the Rust tests that hold its cases (spec fn-1,
      # R16): a Rust test that isn't there, or fewer Rust cases than the C#'s, fails.
      - name: The parity ledger
        run: bash scripts/check-parity.sh
      # Nothing names the C# projects, the solution, the golden generators or the other things the cutover to Rust
      # removed, outside the CHANGELOG, the plans (.flow/) and the frozen golden fixtures.
      - name: No references to the removed .NET code
        run: bash scripts/check-removed-paths.sh
      - name: Executable bits
        run: |
          # The docs run these as ./build.sh and so on, so git must record them as executable (100755). A script added
          # on Windows gets 100644 unless it's set with git update-index --chmod=+x. The plugin's launcher is run
          # through sh, so it needn't be.
          # --error-unmatch fails the step if one of them is gone, instead of no longer checking it.
          listed=$(git ls-files -s --error-unmatch -- build.sh install.sh packaging/linux/install.sh 'scripts/*.sh')
          bad=0
          while read -r mode _ _ path; do
            if [ "$mode" != 100755 ]; then
              echo "::error file=$path::$path isn't executable in git (mode $mode): git update-index --chmod=+x $path"
              bad=1
            fi
          done <<< "$listed"
          exit "$bad"
