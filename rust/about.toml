# cargo-about's settings for THIRD-PARTY-NOTICES.md (fn-1 R19): `cargo about generate --workspace about.hbs` in rust/
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# AiPet's own crates are under its own LICENSE
private = { ignore = true }
