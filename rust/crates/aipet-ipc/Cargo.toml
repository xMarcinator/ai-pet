[package]
name = "aipet-ipc"
description = "The contract the hook and the pet share: the wire protocol's constants, the endpoint, the data paths, and connecting with deadlines. A port of AiPet.Core's Ipc.cs and Paths.cs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
# tests/csharp.rs reads the golden generator's output
serde_json.workspace = true
