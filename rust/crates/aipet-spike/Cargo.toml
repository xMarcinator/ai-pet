[package]
name = "aipet-spike"
description = "The Rust spike of the pet's front end: picks the Wayland (layer-shell) or the desktop (winit) shell."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aipet-spike"
path = "src/main.rs"

[dependencies]
aipet-desktop = { path = "../aipet-desktop" }
aipet-wayland = { path = "../aipet-wayland" }
